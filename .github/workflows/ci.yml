name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -v

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fraud-detection:ci .

      - name: Start container
        run: docker run -d --name app -p 8000:8000 fraud-detection:ci

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health | grep -q '"model_loaded":true'; then
              echo "Service healthy"; exit 0
            fi
            sleep 2
          done
          echo "Service did not become healthy"; docker logs app; exit 1

      - name: Smoke test a prediction
        run: |
          curl -sf "http://localhost:8000/demo/transaction?type=fraud" -o demo.json
          python3 - <<'PY'
          import json, urllib.request
          features = json.load(open("demo.json"))["features"]
          req = urllib.request.Request(
              "http://localhost:8000/predict/?log=false",
              json.dumps({"features": features}).encode(),
              {"Content-Type": "application/json"},
          )
          result = json.loads(urllib.request.urlopen(req, timeout=30).read())
          assert result["prediction"] in ("FRAUD", "LEGITIMATE"), result
          assert len(result["top_factors"]) > 0, result
          print("Prediction OK:", result["prediction"], result["fraud_probability"])
          PY

      - name: Container logs on failure
        if: failure()
        run: docker logs app
