name: CI

on:
  push:
    branches: [main, "devops/**", "feature/**", "fix/**", "ci/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: fraud-detection

jobs:
  # 1. Unit and API tests on a clean runner
  test:
    name: Unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -v

  # 2. Build the image and prove the running container works
  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fraud-detection:ci .

      - name: Start container
        run: docker run -d --name app -p 8000:8000 fraud-detection:ci

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health | grep -q '"model_loaded":true'; then
              echo "Service healthy"; exit 0
            fi
            sleep 2
          done
          echo "Service did not become healthy"; docker logs app; exit 1

      - name: Smoke test a prediction
        run: |
          curl -sf "http://localhost:8000/demo/transaction?type=fraud" -o demo.json
          python3 - <<'PY'
          import json, urllib.request
          features = json.load(open("demo.json"))["features"]
          req = urllib.request.Request(
              "http://localhost:8000/predict/?log=false",
              json.dumps({"features": features}).encode(),
              {"Content-Type": "application/json"},
          )
          result = json.loads(urllib.request.urlopen(req, timeout=30).read())
          assert result["prediction"] in ("FRAUD", "LEGITIMATE"), result
          assert len(result["top_factors"]) > 0, result
          print("Prediction OK:", result["prediction"], result["fraud_probability"])
          PY

      - name: Container logs on failure
        if: failure()
        run: docker logs app

  # 3. Prove the monitoring stack (app + Prometheus + Grafana) works end to end
  monitoring:
    name: Monitoring stack check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Start app, Prometheus and Grafana
        run: docker compose -f deploy/monitoring/docker-compose.yml up -d --build --wait --wait-timeout 180

      - name: Generate some traffic
        run: |
          curl -sf "http://localhost:8000/demo/transaction?type=fraud" -o fraud.json
          curl -sf "http://localhost:8000/demo/transaction?type=legitimate" -o legit.json
          for f in fraud.json legit.json; do
            python3 - "$f" <<'PY'
          import json, sys, urllib.request
          features = json.load(open(sys.argv[1]))["features"]
          for _ in range(5):
              req = urllib.request.Request(
                  "http://localhost:8000/predict/?log=false",
                  json.dumps({"features": features}).encode(),
                  {"Content-Type": "application/json"},
              )
              urllib.request.urlopen(req, timeout=30).read()
          PY
          done

      - name: Prometheus is scraping the app
        run: |
          for i in $(seq 1 24); do
            up=$(curl -sf 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22fraud-api%22%7D' | jq -r '.data.result[0].value[1] // "none"')
            n=$(curl -sf 'http://localhost:9090/api/v1/query?query=sum(fraud_predictions_total)' | jq -r '.data.result[0].value[1] // "0"')
            echo "attempt $i: up=$up predictions=$n"
            if [ "$up" = "1" ] && [ "${n%.*}" -ge 10 ]; then echo "Prometheus OK"; exit 0; fi
            sleep 5
          done
          echo "Prometheus did not report the expected metrics"; exit 1

      - name: Grafana has the datasource and dashboard
        run: |
          curl -sf -u admin:admin http://localhost:3000/api/datasources/uid/prometheus/health | grep -q '"status":"OK"'
          curl -sf -u admin:admin 'http://localhost:3000/api/search?query=Fraud' | jq -e '.[] | select(.title=="Fraud API")'
          echo "Grafana OK"

      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/monitoring/docker-compose.yml logs --no-color --tail 80

      - name: Tear down
        if: always()
        run: docker compose -f deploy/monitoring/docker-compose.yml down -v

  # 4. Release: publish a versioned image once everything above is green (main and tags only)
  release:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [test, docker, monitoring]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 5. Staging: pull the exact published image and check it before anyone relies on it
  staging:
    name: Staging check (published image)
    runs-on: ubuntu-latest
    needs: release
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run the published image
        run: |
          docker pull "${{ needs.release.outputs.image }}:${{ needs.release.outputs.sha_tag }}"
          docker run -d --name staging -p 8000:8000 "${{ needs.release.outputs.image }}:${{ needs.release.outputs.sha_tag }}"

      - name: Verify it serves predictions
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health | grep -q '"model_loaded":true'; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/health | grep -q '"model_loaded":true'
          curl -sf http://localhost:8000/metrics | grep -q fraud_model_loaded
          curl -sf "http://localhost:8000/demo/transaction?type=legitimate" -o demo.json
          python3 - <<'PY'
          import json, urllib.request
          features = json.load(open("demo.json"))["features"]
          req = urllib.request.Request("http://localhost:8000/predict/?log=false",
                                       json.dumps({"features": features}).encode(),
                                       {"Content-Type": "application/json"})
          result = json.loads(urllib.request.urlopen(req, timeout=30).read())
          assert result["prediction"] == "LEGITIMATE", result
          print("Staging OK:", result)
          PY

      - name: Logs on failure
        if: failure()
        run: docker logs staging

  # 6. GitHub Release with notes, only when a version tag such as v1.0.0 is pushed
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: staging
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # 7. Continuous deployment: push the verified code to the Hugging Face Space (main only).
  #    Needs a repository secret named HF_TOKEN; without it this job reports a notice and does nothing.
  deploy-hf:
    name: Deploy to Hugging Face Space
    runs-on: ubuntu-latest
    needs: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: huggingface
    concurrency:
      group: deploy-hf
      cancel-in-progress: false
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: Tkcy1205/cloud-fraud-detection
    steps:
      - name: Check that a token is configured
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::notice title=Deployment skipped::Add a repository secret named HF_TOKEN to enable deployment to the Hugging Face Space."
          fi

      - uses: actions/checkout@v4
        if: env.HF_TOKEN != ''

      - name: Push to the Space
        if: env.HF_TOKEN != ''
        run: bash deploy/huggingface/sync_space.sh

      - name: Wait for the Space to serve the new version
        if: env.HF_TOKEN != ''
        run: |
          owner="${HF_SPACE%%/*}"; name="${HF_SPACE##*/}"
          url="https://${owner,,}-${name,,}.hf.space"
          echo "Waiting for $url (the Space rebuilds after every push; this can take several minutes)"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/monitoring/summary" || true)
            echo "attempt $i: /monitoring/summary -> $code"
            if [ "$code" = "200" ]; then
              curl -sf "$url/health" | grep -q '"model_loaded":true' && { echo "Space is serving the new version"; exit 0; }
            fi
            sleep 20
          done
          echo "The Space did not serve the new version in time"; exit 1
